name: Refresh Composer Lockfile

on:
  push:
    branches:
      - maintenance/composer-lock-refresh

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Resolve and verify locked dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_sqlite, xml
          coverage: none
          tools: composer:v2

      - name: Resolve and lock dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Validate Composer configuration and lockfile
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite with resolved dependencies
        run: composer test

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock is already current"
          else
            git commit -m "chore: lock Composer dependencies"
            git push origin HEAD
          fi
